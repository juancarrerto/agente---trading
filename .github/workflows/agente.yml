# Agente de trading en la cuenta DEMO de Alpaca. Modo continuo: UNA ejecución por día de bolsa que arranca temprano y vigila cada 20 segundos
# hasta que termina la ventana de entradas y no queda nada abierto (así evalúa todas las ocasiones aunque GitHub retrase el arranque).
# El agente calcula las horas con el reloj de Nueva York, así que el horario de verano no obliga a tocar nada: estas horas UTC son
# 7:53 a. m. (invierno) u 8:53 a. m. (verano) en Nueva York, antes de la apertura de las 9:30. La segunda es un respaldo por si GitHub omite la primera.
# Requiere repositorio PÚBLICO (minutos ilimitados): una ejecución dura entre 2 y 6 horas.
name: Agente de trading (demo)

on:
  schedule:
    - cron: '53 12 * * 1-5'
    - cron: '23 13 * * 1-5'
  workflow_dispatch:

concurrency:
  group: agente-trading
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agente:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Agente (modo continuo)
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          AGENTE_APAGADO: ${{ vars.AGENTE_APAGADO }}
        run: |
          if [ -z "$ALPACA_KEY_ID" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "::notice::Faltan los Secrets ALPACA_KEY_ID y ALPACA_SECRET_KEY (Settings > Secrets and variables > Actions). El agente no corre todavía."
            exit 0
          fi
          node src/agente.js --ejecucion diario
      - name: Guardar estado y bitácora
        if: always()
        run: |
          git config user.name "agente-trading"
          git config user.email "agente-trading@users.noreply.github.com"
          git add datos/estado.json datos/bitacora.jsonl 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "datos: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash || true
            git push
          fi
