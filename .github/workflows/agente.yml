# Agente de trading en la cuenta DEMO de Alpaca. Modo continuo, en dos tramos por día de bolsa (GitHub corta cada ejecución a las 6 horas):
#   * Mañana: arranca antes de la apertura (12:53 UTC = 7:53 a. m. en Nueva York en invierno) y vigila cada 20 segundos hasta terminar la ventana de las 9:35-11:15
#     y quedar sin nada abierto; entonces se sale.
#   * Tarde: arranca a las 16:50 UTC (11:50 a. m. en invierno) y espera hasta la ventana de las 14:15-15:30; cierra todo a las 15:55.
# Cada hora tiene un respaldo por si GitHub omite la primera. El agente usa el reloj de Nueva York para todo, así que el horario de verano no obliga a tocar nada
# (las ejecuciones arrancan una hora más tarde en reloj de Nueva York, y siguen siendo antes de cada ventana).
# Requiere repositorio PÚBLICO (minutos ilimitados): entre las dos ejecuciones suman unas 6 horas por día.
name: Agente de trading (demo)

on:
  schedule:
    - cron: '53 12 * * 1-5'
    - cron: '23 13 * * 1-5'
    - cron: '50 16 * * 1-5'
    - cron: '20 17 * * 1-5'
  workflow_dispatch:

concurrency:
  group: agente-trading
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agente:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main     # lo más reciente al empezar: una ejecución que esperó en cola no debe trabajar con el estado viejo en que se programó
      - name: Agente (modo continuo)
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          AGENTE_APAGADO: ${{ vars.AGENTE_APAGADO }}
        run: |
          if [ -z "$ALPACA_KEY_ID" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "::notice::Faltan los Secrets ALPACA_KEY_ID y ALPACA_SECRET_KEY (Settings > Secrets and variables > Actions). El agente no corre todavía."
            exit 0
          fi
          node src/agente.js --ejecucion diario
      - name: Guardar estado y bitácora
        if: always()
        run: |
          git config user.name "agente-trading"
          git config user.email "agente-trading@users.noreply.github.com"
          git add datos/estado.json datos/bitacora.jsonl 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "datos: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash || true
            git push
          fi
